spring:
  application:
    name: RuralWell

  datasource:
    url: jdbc:postgresql://localhost:5432/serviciosocial
    username: postgres
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  docker:
    compose:
      enabled: false

app:
  jwt:
    secret: ${JWT_SECRET:clave-super-secreta-de-al-menos-256-bits-para-jwt-hmac-sha}
    expiration: 86400000  # 24 horas en ms

  openai:
    api-key: ${OPENAI_API_KEY:}
    model: "gpt-4o-mini"
    max-tokens: 1000
    base-url: "https://api.openai.com/v1"

  cors:
    allowed-origins: "http://localhost:5173,http://localhost:5174"
